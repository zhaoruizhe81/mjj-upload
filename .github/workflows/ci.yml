name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: offline tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q mjj_upload.py

      - name: 离线单元测试（不联网）
        run: python -m unittest discover -s tests -v

      - name: CLI 冒烟（--help / --list）
        run: |
          python mjj_upload.py --help > /dev/null
          python mjj_upload.py --list 5 || true

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --select E9,F63,F7,F82 --output-format=concise ."
